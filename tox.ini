[tox]
envlist = ty, py3.{13,14,15}

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    pytest
    pytest-xdist
# what follows `--` is passed to pytest, e.g. `tox r -e py3.14 -- --durations=15`
commands =
    pytest {posargs}

[testenv:ty]
passenv =
    TY_OUTPUT_FORMAT
deps =
    ty
    pytest
commands =
    ty check
